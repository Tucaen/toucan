name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR makes the older run moot. Runs on main are never cancelled: both
# release gates (scripts/release-gate.mjs) want a finished verdict on the very commit they release,
# and a cancelled run is a refusal. Releases have their own workflow and never share this group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    # Toucan is Windows-only, and so is its test suite.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check

  package:
    # The release's own Build and packaging steps, minus the upload: a change that breaks
    # electron-vite, the mobile build, electron-builder's config or a file it packs goes red here,
    # on the change, instead of after a tag has been pushed. Runs beside `check`, so CI takes no
    # longer than before; nothing is uploaded or kept.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run package:ci

      - run: node scripts/check-package.mjs
