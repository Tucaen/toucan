name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Restore the prepared voice model
        uses: actions/cache@v4
        with:
          path: src/renderer/public/models/moonshine-small-streaming-en
          key: voice-model-${{ hashFiles('package-lock.json', 'scripts/prepare-voice-model.mjs') }}

      - name: Prepare the voice model
        run: npm run prepare:voice-model

      - name: Verify
        run: npm run check

      - name: Build
        run: npm run build

      - name: Package and publish
        run: npm run publish:win
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
