name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify
        run: npm run check

      - name: Build
        run: npm run build

      # Both Windows targets publish independently, and each will create the release if it is not
      # there yet. Two creates race; the loser gets a 422 ("Published releases must have a valid
      # tag") and takes the remaining uploads down with it - which is how v0.3.1 ended up holding
      # its two installers but no latest.yml, leaving the updater with no feed to read. Claiming
      # the release up front leaves both publishers with nothing to do but upload into it.
      # The notes are the tag's annotation body, written by `npm run release`. Checkout stores the
      # tag as a plain pointer to the commit, so the annotated object is fetched again first.
      - name: Claim the release before packaging
        run: |
          # The braces around env:TAG are load-bearing. Unbraced, a following colon is swallowed
          # into the variable path, which built the refspec 'refs/tags//tags/v0.8.3'. The
          # fetch then failed without failing the step, the flattened tag carried no body, and the
          # releases published the "Automated release." fallback instead of the notes.
          git fetch --force --quiet origin "refs/tags/${env:TAG}:refs/tags/${env:TAG}"
          if ($LASTEXITCODE -ne 0) { throw "could not fetch the annotated tag ${env:TAG}" }
          $notes = (git tag -l --format='%(contents:body)' "${env:TAG}" | Out-String).Trim()
          if (-not $notes) { $notes = "Automated release." }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          # package.json build.publish is the one source of truth for the releases repo;
          # electron-builder and electron-updater read the same block.
          $publish = (Get-Content package.json -Raw | ConvertFrom-Json).build.publish
          $releasesRepo = "$($publish.owner)/$($publish.repo)"
          gh release view "${env:TAG}" --repo $releasesRepo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${env:TAG}" --repo $releasesRepo --title "Toucan ${env:TAG}" --notes-file release-notes.md
          } else {
            # A re-run meets the release its first attempt claimed; the notes are still ours to write.
            gh release edit "${env:TAG}" --repo $releasesRepo --notes-file release-notes.md
          }
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}

      - name: Package and publish
        run: npm run publish:win
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
