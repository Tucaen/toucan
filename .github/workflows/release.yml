name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Restore the prepared voice model
        uses: actions/cache@v4
        with:
          path: src/renderer/public/models/moonshine-small-streaming-en
          key: voice-model-${{ hashFiles('package-lock.json', 'scripts/prepare-voice-model.mjs') }}

      - name: Prepare the voice model
        run: npm run prepare:voice-model

      - name: Verify
        run: npm run check

      - name: Build
        run: npm run build

      # Both Windows targets publish independently, and each will create the release if it is not
      # there yet. Two creates race; the loser gets a 422 ("Published releases must have a valid
      # tag") and takes the remaining uploads down with it - which is how v0.3.1 ended up holding
      # its two installers but no latest.yml, leaving the updater with no feed to read. Claiming
      # the release up front leaves both publishers with nothing to do but upload into it.
      - name: Claim the release before packaging
        run: |
          gh release view "$env:TAG" --repo Tucaen/toucan-releases *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:TAG" --repo Tucaen/toucan-releases --title "$env:TAG" --notes "Automated release."
          }
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          TAG: ${{ github.ref_name }}

      - name: Package and publish
        run: npm run publish:win
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
