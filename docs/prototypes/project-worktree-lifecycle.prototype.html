<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADE project canvas prototype</title>
  <!-- Three Project-workspace variants: canvas + Coordinator, split view, and automatic Flow view. -->
  <style>
    :root {
      color-scheme: light;
      --ink: #1b1c1d;
      --muted: #72767c;
      --line: #dedfe1;
      --paper: #fff;
      --panel: #f5f5f3;
      --canvas: #f8f8f6;
      --accent: #3269e8;
      --accent-soft: #e9efff;
      --green: #239767;
      --amber: #d2912d;
      --shadow: 0 14px 40px rgba(28, 30, 32, .11);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body, #app { width: 100%; min-height: 100%; }
    body { margin: 0; overflow: hidden; background: var(--canvas); color: var(--ink); }
    button, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    svg { display: block; }

    .row { display: flex; align-items: center; gap: 9px; }
    .spacer { flex: 1; }
    .muted { color: var(--muted); }
    .dot { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: #a7abb0; }
    .dot.live { background: var(--green); box-shadow: 0 0 0 3px rgba(35,151,103,.12); }
    .dot.waiting { background: var(--amber); }

    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.025em; }
    .brand-mark { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 9px; background: var(--ink); color: white; font-size: 12px; }
    .avatar { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #dedbd4; font-size: 12px; font-weight: 800; }

    .ghost, .primary, .project-row, .top-tab, .node-action { border: 0; border-radius: 8px; background: transparent; }
    .ghost { padding: 8px 10px; font-weight: 650; }
    .ghost:hover, .project-row:hover, .top-tab:hover, .node-action:hover { background: rgba(30,32,34,.065); }
    .primary { display: inline-flex; align-items: center; gap: 7px; padding: 9px 12px; background: var(--ink); color: #fff; font-weight: 720; }
    .count { min-width: 22px; padding: 2px 7px; border-radius: 999px; background: #e8e8e5; color: #65686d; font-size: 11px; font-weight: 750; text-align: center; }
    .view-switch { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: #f1f1ef; }
    .view-switch button { padding: 5px 9px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 10px; font-weight: 720; }
    .view-switch button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(30,32,34,.09); }

    .canvas {
      position: relative;
      overflow: hidden;
      background-color: var(--canvas);
      background-image: radial-gradient(circle, #cfd1d3 1px, transparent 1.2px);
      background-size: 24px 24px;
    }
    .canvas::after { content: "Drag sessions to arrange this Project"; position: absolute; right: 18px; bottom: 18px; color: #a0a2a5; font-size: 11px; pointer-events: none; }

    .session-node {
      position: absolute;
      z-index: 3;
      width: 286px;
      min-height: 174px;
      overflow: hidden;
      border: 1px solid #d7d8da;
      border-radius: 13px;
      background: rgba(255,255,255,.96);
      box-shadow: var(--shadow);
    }
    .session-node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(50,105,232,.12), var(--shadow); }
    .session-node.needs-input { border-color: #d7a14c; box-shadow: 0 0 0 2px rgba(210,145,45,.12), var(--shadow); }
    .session-node.needs-input .node-body { height: 190px; }
    .node-header { display: flex; align-items: center; gap: 8px; height: 41px; padding: 0 11px; border-bottom: 1px solid #e7e8e9; background: #fafafa; cursor: grab; user-select: none; touch-action: none; }
    .node-header:active { cursor: grabbing; }
    .node-title { min-width: 0; overflow: hidden; font-size: 12px; font-weight: 760; text-overflow: ellipsis; white-space: nowrap; }
    .provider { padding: 3px 6px; border-radius: 5px; background: var(--accent-soft); color: #365baf; font-size: 9px; font-weight: 820; letter-spacing: .04em; text-transform: uppercase; }
    .node-action { display: grid; place-items: center; width: 24px; height: 24px; color: var(--muted); }
    .node-body { height: 98px; padding: 12px; }
    .node-body p { margin: 0 0 9px; color: #4b4e53; font-size: 12px; line-height: 1.48; }
    .terminal-line { overflow: hidden; color: #8a8d92; font: 10px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .node-footer { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 11px; border-top: 1px solid #ededed; color: var(--muted); font-size: 10px; }
    .question-label { margin-bottom: 5px; color: #a66b16; font-size: 9px; font-weight: 820; letter-spacing: .07em; text-transform: uppercase; }
    .question-copy { margin-bottom: 9px !important; color: #3f372b !important; font-weight: 650; }
    .answer-form { display: grid; gap: 6px; }
    .answer-form textarea { width: 100%; min-width: 0; min-height: 56px; max-height: 140px; resize: vertical; padding: 7px 8px; border: 1px solid #d8d5ce; border-radius: 7px; outline: 0; background: #fff; font: inherit; font-size: 10px; line-height: 1.35; }
    .answer-form textarea:focus { border-color: var(--accent); }
    .answer-form button { justify-self: end; height: 31px; padding: 0 9px; border: 0; border-radius: 7px; background: var(--ink); color: #fff; font-size: 10px; font-weight: 750; }

    .empty-canvas { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
    .empty-card { max-width: 380px; padding: 24px; border: 1px dashed #cfd1d3; border-radius: 15px; background: rgba(255,255,255,.7); text-align: center; }
    .empty-card h2 { margin: 0 0 7px; font-size: 19px; }
    .empty-card p { margin: 0; color: var(--muted); font-size: 13px; }

    .flow-board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; min-height: 0; padding: 16px 16px 92px; overflow: auto; background: #f5f5f2; }
    .flow-lane { min-width: 240px; padding: 10px; border: 1px solid #e0e0dc; border-radius: 13px; background: rgba(255,255,255,.45); }
    .flow-lane-header { display: flex; align-items: center; gap: 7px; height: 31px; padding: 0 3px 10px; color: #686b70; font-size: 10px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
    .flow-lane-body { display: grid; align-content: start; gap: 10px; }
    .flow-node { position: relative; width: 100%; min-height: 158px; box-shadow: 0 6px 18px rgba(28,30,32,.07); }
    .flow-node .node-header { cursor: default; }
    .flow-empty { padding: 18px 9px; border: 1px dashed #d4d4d0; border-radius: 10px; color: #9a9c9f; font-size: 11px; text-align: center; }

    .coordinator-composer { border: 1px solid #d3d4d6; border-radius: 14px; background: rgba(255,255,255,.97); box-shadow: 0 13px 38px rgba(28,30,32,.14); backdrop-filter: blur(12px); }
    .coordinator-composer textarea { display: block; width: 100%; min-height: 53px; resize: none; padding: 12px 13px 4px; border: 0; outline: 0; background: transparent; font-size: 13px; line-height: 1.45; }
    .composer-footer { display: flex; align-items: center; gap: 7px; padding: 7px; }
    .project-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px; border: 1px solid #e0e1e2; border-radius: 999px; background: #fafafa; color: #5b5e63; font-size: 10px; font-weight: 720; }
    .send { display: grid; place-items: center; width: 31px; height: 31px; border: 0; border-radius: 9px; background: var(--ink); color: white; }

    .prototype-switcher {
      position: fixed; z-index: 100; left: 50%; bottom: 12px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 5px; padding: 5px;
      border: 1px solid rgba(255,255,255,.14); border-radius: 999px;
      background: #171819; color: #fff; box-shadow: 0 14px 38px rgba(0,0,0,.25);
    }
    .prototype-switcher button { display: grid; place-items: center; width: 33px; height: 33px; border: 0; border-radius: 50%; background: transparent; color: #fff; }
    .prototype-switcher button:hover { background: rgba(255,255,255,.13); }
    .prototype-copy { min-width: 210px; padding: 0 10px; text-align: center; }
    .prototype-copy strong { display: block; font-size: 11px; }
    .prototype-copy span { display: block; color: #aeb0b3; font-size: 9px; }

    /* A — Canvas-first: the project is the canvas, with navigation kept quiet. */
    .variant-a { display: grid; grid-template-columns: 228px minmax(0,1fr) 338px; min-height: 100vh; }
    .a-rail { display: flex; flex-direction: column; padding: 14px 10px 76px; border-right: 1px solid var(--line); background: #efefec; }
    .a-rail .brand { padding: 4px 7px 18px; }
    .a-rail-heading { margin: 22px 8px 6px; color: var(--muted); font-size: 10px; font-weight: 770; letter-spacing: .08em; text-transform: uppercase; }
    .project-row { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px; text-align: left; }
    .project-row.active { background: #deded9; }
    .project-glyph { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; background: #dce5fb; color: #335aaf; font-size: 9px; font-weight: 820; }
    .rail-footer { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid #d9d9d4; }
    .a-workspace { display: grid; grid-template-rows: 58px minmax(0,1fr); min-width: 0; }
    .a-toolbar { display: flex; align-items: center; padding: 0 18px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.91); }
    .workspace-title { font-size: 13px; font-weight: 760; }
    .workspace-subtitle { margin-left: 9px; color: var(--muted); font-size: 11px; }
    .a-canvas { min-height: 0; }
    .a-coordinator { display: flex; min-width: 0; flex-direction: column; padding-bottom: 69px; border-left: 1px solid var(--line); background: #fff; }
    .a-coordinator-header { display: flex; align-items: center; height: 58px; padding: 0 14px; border-bottom: 1px solid var(--line); }
    .a-coordinator-header strong { font-size: 12px; }
    .a-thread { flex: 1; overflow: auto; padding: 20px 16px; }
    .a-thread .chat-message.user { margin-left: 30px; }
    .a-thread-empty { color: var(--muted); font-size: 12px; line-height: 1.55; }
    .a-coordinator-compose { padding: 0 12px 10px; }

    /* B — Split focus: Codex-like Coordinator thread beside a spatial session canvas. */
    .variant-b { display: grid; grid-template-columns: 410px minmax(0,1fr); min-height: 100vh; }
    .b-chat { display: flex; flex-direction: column; padding-bottom: 76px; border-right: 1px solid var(--line); background: #fff; }
    .b-chat-header { display: flex; align-items: center; height: 60px; padding: 0 17px; border-bottom: 1px solid var(--line); }
    .b-thread { flex: 1; overflow: auto; padding: 28px 23px; }
    .b-thread h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: -.035em; }
    .b-thread > p { margin: 0 0 28px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .chat-message { display: grid; grid-template-columns: 29px minmax(0,1fr); gap: 10px; margin-top: 22px; }
    .chat-message.user { display: block; margin-left: 50px; padding: 11px 13px; border-radius: 14px 14px 4px 14px; background: #eeeeeb; font-size: 13px; }
    .coordinator-mark { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 9px; background: var(--ink); color: white; font-size: 10px; font-weight: 820; }
    .chat-copy { padding-top: 3px; font-size: 13px; line-height: 1.55; }
    .attention-card { margin-top: 10px; padding: 11px; border: 1px solid #e0bd82; border-radius: 10px; background: #fffaf0; }
    .attention-card .question-copy { font-size: 12px; line-height: 1.45; }
    .attention-card .answer-form textarea { min-height: 72px; font-size: 11px; }
    .attention-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 7px; border-radius: 999px; background: #fff0d5; color: #936015; font-size: 9px; font-weight: 800; }
    .b-composer { padding: 0 16px; }
    .b-canvas-area { display: grid; grid-template-rows: 60px minmax(0,1fr); min-width: 0; }
    .b-toolbar { display: flex; align-items: center; padding: 0 18px; border-bottom: 1px solid var(--line); background: #f7f7f5; }
    .b-canvas { min-height: 0; }
    .b-canvas .session-node { width: 260px; }
    .project-select { max-width: 145px; padding: 7px 28px 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #f8f8f6; color: var(--ink); font-size: 11px; font-weight: 700; }

    /* C — Spatial rooms: a full project desktop with loose visual regions. */
    .variant-c { display: grid; grid-template-rows: 60px minmax(0,1fr); min-height: 100vh; }
    .c-topbar { display: flex; align-items: center; padding: 0 18px; border-bottom: 1px solid var(--line); background: #fff; }
    .project-tabs { display: flex; align-self: stretch; margin-left: 28px; }
    .top-tab { position: relative; padding: 0 13px; color: var(--muted); font-weight: 680; }
    .top-tab.active { color: var(--ink); }
    .top-tab.active::after { content: ""; position: absolute; right: 12px; bottom: -1px; left: 12px; height: 2px; background: var(--ink); }
    .c-canvas { min-height: 0; }
    .c-flow { min-height: 0; }
    .zone { position: absolute; z-index: 0; top: 40px; bottom: 90px; border: 1px dashed rgba(110,113,118,.28); border-radius: 17px; background: rgba(255,255,255,.22); pointer-events: none; }
    .zone span { position: absolute; top: 12px; left: 14px; color: #96999d; font-size: 10px; font-weight: 780; letter-spacing: .08em; text-transform: uppercase; }
    .zone.research { left: 28px; width: 29%; }
    .zone.build { left: 34%; width: 37%; }
    .zone.review { right: 28px; width: 25%; }
    .c-compose { position: fixed; z-index: 20; right: 0; bottom: 66px; left: 0; pointer-events: none; }
    .c-compose .coordinator-composer { width: min(690px, calc(100% - 38px)); margin: 0 auto; pointer-events: auto; }

    @media (max-width: 850px) {
      .variant-a { grid-template-columns: 1fr; }
      .a-rail { display: none; }
      .a-coordinator { position: fixed; z-index: 30; top: 0; right: 0; bottom: 0; width: min(360px, 92vw); box-shadow: var(--shadow); }
      .variant-b { grid-template-columns: 1fr; }
      .b-chat { display: none; }
      .b-canvas-area { grid-column: 1; }
      .project-tabs .top-tab:not(.active) { display: none; }
      .zone { display: none; }
      .prototype-copy { min-width: 160px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const variants = {
      A: { name: "Canvas + Coordinator" },
      B: { name: "Split workspace" },
      C: { name: "Automatic Flow" }
    };

    const projects = {
      ADE: {
        sessions: [
          { id: "s1", title: "Project canvas direction", provider: "Codex", status: "Working", phase: "build", tone: "live", detail: "Mapping the canvas interaction and first-use flow.", terminal: "› inspecting prototype layout", x: 72, y: 78 },
          { id: "s2", title: "NodeTerm patterns", provider: "Claude", status: "Ready", phase: "review", tone: "", detail: "Distilling spatial multi-session patterns.", terminal: "✓ notes ready for review", x: 420, y: 126 },
          { id: "s3", title: "Issue #4", provider: "Codex", status: "Needs input", phase: "waiting", tone: "waiting", detail: "A clarification is blocking the next step.", terminal: "… waiting for owner answer", x: 270, y: 354 }
        ],
        conversation: [],
        attention: {
          id: "ATT-12",
          sessionId: "s3",
          question: "Should Agent Session questions be answered only through the Coordinator, or also directly on their canvas cards?",
          resolved: false,
          answer: "",
          answeredFrom: ""
        }
      },
      Geometry: {
        sessions: [
          { id: "g1", title: "Combat feel", provider: "Claude", status: "Working", phase: "explore", tone: "live", detail: "Reviewing the current combat loop.", terminal: "› reading scene graph", x: 110, y: 110 },
          { id: "g2", title: "Map validation", provider: "Codex", status: "Done", phase: "review", tone: "", detail: "Validated maps and captured results.", terminal: "✓ 12 maps passed", x: 480, y: 270 }
        ],
        conversation: [],
        attention: null
      },
      Notes: { sessions: [], conversation: [], attention: null }
    };

    let state = {
      project: "ADE",
      prompt: "",
      selectedSession: null,
      nextId: 10,
      drag: null,
      viewMode: "canvas"
    };

    const icons = {
      plus: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 5v14M5 12h14"/></svg>',
      send: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 12 4-4 4 4M12 8v9"/></svg>',
      dots: '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>',
      left: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>',
      right: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>'
    };

    function escapeHtml(value) {
      return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    }

    function activeProject() { return projects[state.project]; }
    function currentVariant() {
      const key = new URLSearchParams(location.search).get("variant")?.toUpperCase();
      return variants[key] ? key : "A";
    }

    function setVariant(key) {
      const url = new URL(location.href);
      url.searchParams.set("variant", key);
      history.replaceState({}, "", url);
      render();
    }

    function cycleVariant(direction) {
      const keys = Object.keys(variants);
      const index = keys.indexOf(currentVariant());
      setVariant(keys[(index + direction + keys.length) % keys.length]);
    }

    function selectProject(name) {
      state.project = name;
      state.selectedSession = null;
      render();
    }

    function createSession(prompt) {
      const text = prompt.trim() || "Untitled task";
      const sessions = activeProject().sessions;
      const index = sessions.length;
      const id = `n${state.nextId++}`;
      sessions.push({
        id,
        title: text.length > 36 ? `${text.slice(0, 35)}…` : text,
        provider: index % 2 === 0 ? "Codex" : "Claude",
        status: "Starting",
        phase: "explore",
        tone: "live",
        detail: "The Coordinator is preparing context and an isolated workspace.",
        terminal: "› starting agent session",
        x: 90 + (index % 3) * 315,
        y: 80 + (index % 2) * 230
      });
      activeProject().conversation.push({ role: "user", text }, { role: "assistant", text: `Started a new session for “${text}”. You can place it anywhere on this Project canvas.` });
      state.prompt = "";
      state.selectedSession = id;
      render();
    }

    function pendingAttention() {
      const attention = activeProject().attention;
      return attention && !attention.resolved ? attention : null;
    }

    function answerForm(source) {
      return `<form class="answer-form" data-answer-form data-answer-source="${source}"><textarea aria-label="Answer clarification" placeholder="Type your answer…"></textarea><button type="submit">Answer</button></form>`;
    }

    function answerAttention(answer, source) {
      const text = answer.trim();
      const attention = pendingAttention();
      if (!attention || !text) return;
      attention.resolved = true;
      attention.answer = text;
      attention.answeredFrom = source;
      const session = activeProject().sessions.find((item) => item.id === attention.sessionId);
      if (session) {
        session.status = "Working";
        session.phase = "build";
        session.tone = "live";
        session.detail = `Continuing with your answer: ${text}`;
        session.terminal = "› owner answer received; resuming";
      }
      activeProject().conversation.push(
        { role: "user", text: `Answer to ${session?.title || "Agent Session"}: ${text}` },
        { role: "assistant", text: `Got it. You answered from the ${source}; I routed it to ${session?.title || "the session"}. The same clarification is now resolved everywhere.` }
      );
      render();
    }

    function nodeMarkup(session, flow = false) {
      const attention = pendingAttention();
      const needsInput = attention?.sessionId === session.id;
      const body = needsInput
        ? `<div class="question-label">Question from ${escapeHtml(session.provider)}</div><p class="question-copy">${escapeHtml(attention.question)}</p>${answerForm("session card")}`
        : `<p>${escapeHtml(session.detail)}</p><div class="terminal-line">${escapeHtml(session.terminal)}</div>`;
      return `
        <article class="session-node ${flow ? "flow-node" : ""} ${needsInput ? "needs-input" : ""} ${state.selectedSession === session.id ? "selected" : ""}" data-session="${session.id}" ${flow ? "" : `style="left:${session.x}px;top:${session.y}px"`}>
          <header class="node-header" ${flow ? "" : `data-drag-handle="${session.id}"`}>
            <span class="dot ${session.tone}"></span>
            <span class="node-title">${escapeHtml(session.title)}</span>
            <span class="spacer"></span>
            <span class="provider">${escapeHtml(session.provider)}</span>
            <button class="node-action" data-select-session="${session.id}" aria-label="Session menu">${icons.dots}</button>
          </header>
          <div class="node-body">${body}</div>
          <footer class="node-footer"><span>${escapeHtml(session.status)}</span><span class="spacer"></span><span>isolated worktree</span></footer>
        </article>`;
    }

    function canvasMarkup(className, zones = false) {
      const sessions = activeProject().sessions;
      return `
        <section class="canvas ${className}" data-canvas>
          ${zones ? '<div class="zone research"><span>Explore</span></div><div class="zone build"><span>Build</span></div><div class="zone review"><span>Review</span></div>' : ""}
          ${sessions.map(nodeMarkup).join("")}
          ${sessions.length ? "" : '<div class="empty-canvas"><div class="empty-card"><h2>This Project canvas is empty</h2><p>Ask the Coordinator to start something, or add a blank session.</p></div></div>'}
        </section>`;
    }

    function flowBoardMarkup(className = "") {
      const lanes = [["explore", "Explore"], ["build", "Build"], ["review", "Review"], ["waiting", "Waiting"]];
      return `<section class="flow-board ${className}">${lanes.map(([phase, label]) => {
        const sessions = activeProject().sessions.filter((session) => session.phase === phase);
        return `<section class="flow-lane"><header class="flow-lane-header"><span class="dot ${phase === "build" ? "live" : phase === "waiting" ? "waiting" : ""}"></span><span>${label}</span><span class="spacer"></span><span class="count">${sessions.length}</span></header><div class="flow-lane-body">${sessions.length ? sessions.map((session) => nodeMarkup(session, true)).join("") : '<div class="flow-empty">No sessions here</div>'}</div></section>`;
      }).join("")}</section>`;
    }

    function composer() {
      return `
        <form class="coordinator-composer" data-composer>
          <textarea aria-label="Message the Coordinator" placeholder="What should we work on in ${escapeHtml(state.project)}?">${escapeHtml(state.prompt)}</textarea>
          <div class="composer-footer"><span class="project-chip"><span class="dot live"></span>${escapeHtml(state.project)}</span><span class="muted" style="font-size:10px">Coordinator</span><span class="spacer"></span><button class="send" type="submit" aria-label="Start session">${icons.send}</button></div>
        </form>`;
    }

    function projectRows() {
      return Object.entries(projects).map(([name, project]) => `
        <button class="project-row ${state.project === name ? "active" : ""}" data-project="${name}">
          <span class="project-glyph">${name.slice(0,2).toUpperCase()}</span><span>${name}</span><span class="spacer"></span>${project.attention && !project.attention.resolved ? '<span class="dot waiting" title="Needs input"></span>' : ""}<span class="count">${project.sessions.length}</span>
        </button>`).join("");
    }

    function projectTabs() {
      return Object.entries(projects).map(([name, project]) => `<button class="top-tab ${state.project === name ? "active" : ""}" data-project="${name}">${name} <span class="count">${project.sessions.length}</span></button>`).join("");
    }

    function projectSelect() {
      return `<select class="project-select" data-project-select aria-label="Switch Project">${Object.keys(projects).map((name) => `<option value="${name}" ${state.project === name ? "selected" : ""}>${name} · ${projects[name].sessions.length} sessions</option>`).join("")}</select>`;
    }

    function viewSwitch() {
      return `<div class="view-switch" aria-label="Workspace view"><button class="${state.viewMode === "canvas" ? "active" : ""}" data-view-mode="canvas">Canvas</button><button class="${state.viewMode === "flow" ? "active" : ""}" data-view-mode="flow">Flow</button></div>`;
    }

    function renderVariantA() {
      return `
        <div class="variant-a">
          <aside class="a-rail">
            <div class="brand"><span class="brand-mark">A</span>ADE</div>
            <button class="primary" data-add-session>${icons.plus} New session</button>
            <div class="a-rail-heading">Projects</div>${projectRows()}
            <div class="a-rail-heading">Workspace</div>
            <div style="padding:5px 8px;color:var(--muted);font-size:11px;line-height:1.5">Canvas remembers your layout. Flow arranges sessions automatically by status.</div>
            <div class="rail-footer row"><span class="avatar">M</span><span>Morgan</span><span class="spacer"></span><span class="dot live"></span></div>
          </aside>
          <main class="a-workspace">
            <header class="a-toolbar"><span class="workspace-title">${escapeHtml(state.project)}</span><span class="workspace-subtitle">${state.viewMode === "canvas" ? "Project canvas" : "Automatic status view"}</span><span class="spacer"></span>${viewSwitch()}<span class="muted" style="font-size:11px">${activeProject().sessions.length} sessions</span></header>
            ${state.viewMode === "canvas" ? canvasMarkup("a-canvas") : flowBoardMarkup("a-flow")}
          </main>
          <aside class="a-coordinator">
            <header class="a-coordinator-header"><span class="dot live"></span><strong>Coordinator</strong><span class="spacer"></span>${pendingAttention() ? '<span class="attention-chip"><span class="dot waiting"></span>1 question</span>' : '<span class="muted" style="font-size:10px">Primary conversation</span>'}</header>
            <div class="a-thread">${conversationMarkup()}</div>
            <div class="a-coordinator-compose">${composer()}</div>
          </aside>
        </div>`;
    }

    function conversationMarkup() {
      const messages = activeProject().conversation;
      const opening = !messages.length ? '<div class="chat-message"><span class="coordinator-mark">A</span><div class="chat-copy">I’m ready. Tell me what outcome you want, and I’ll answer here—even when the work itself moves into Agent Sessions.</div></div><p class="a-thread-empty">Clarifying questions, approvals, and final results stay in this conversation.</p>' : "";
      const history = messages.map((message) => message.role === "user"
        ? `<div class="chat-message user">${escapeHtml(message.text)}</div>`
        : `<div class="chat-message"><span class="coordinator-mark">A</span><div class="chat-copy">${escapeHtml(message.text)}</div></div>`).join("");
      const attention = pendingAttention();
      const question = attention ? `<div class="chat-message"><span class="coordinator-mark">A</span><div class="chat-copy">A session needs your input.<div class="attention-card"><div class="row"><span class="attention-chip">${escapeHtml(attention.id)}</span><span class="muted" style="font-size:10px">from Issue #4</span></div><p class="question-copy">${escapeHtml(attention.question)}</p>${answerForm("Coordinator")}</div></div></div>` : "";
      return opening + history + question;
    }

    function renderVariantB() {
      return `
        <div class="variant-b">
          <section class="b-chat">
            <header class="b-chat-header"><div class="brand"><span class="brand-mark">A</span>ADE</div><span class="spacer"></span>${projectSelect()}<span class="avatar">T</span></header>
            <div class="b-thread"><p class="muted" style="font-size:11px;margin-bottom:6px">${escapeHtml(state.project)} · Coordinator</p><h1>What are we building?</h1>${conversationMarkup()}</div>
            <div class="b-composer">${composer()}</div>
          </section>
          <main class="b-canvas-area">
            <header class="b-toolbar"><span class="workspace-title">Session canvas</span><span class="spacer"></span><button class="ghost" data-add-session>${icons.plus} Add session</button><span class="count">${activeProject().sessions.length}</span></header>
            ${canvasMarkup("b-canvas")}
          </main>
        </div>`;
    }

    function renderVariantC() {
      return `
        <div class="variant-c">
          <header class="c-topbar"><div class="brand"><span class="brand-mark">A</span>ADE</div><nav class="project-tabs">${projectTabs()}</nav><span class="spacer"></span><button class="primary" data-add-session>${icons.plus} Session</button><span class="avatar">T</span></header>
          ${flowBoardMarkup("c-flow")}
          <div class="c-compose">${composer()}</div>
        </div>`;
    }

    function switcher() {
      const key = currentVariant();
      return `<div class="prototype-switcher"><button data-cycle="-1" aria-label="Previous variant">${icons.left}</button><div class="prototype-copy"><strong>${key} — ${variants[key].name}</strong><span>${escapeHtml(state.project)} · ${activeProject().sessions.length} sessions · ${key === "C" || state.viewMode === "flow" ? "auto-arranged" : "freeform"}</span></div><button data-cycle="1" aria-label="Next variant">${icons.right}</button></div>`;
    }

    function beginDrag(event, id) {
      if (event.target.closest("button")) return;
      const node = document.querySelector(`[data-session="${id}"]`);
      const canvas = node.closest("[data-canvas]");
      const nodeRect = node.getBoundingClientRect();
      const canvasRect = canvas.getBoundingClientRect();
      state.selectedSession = id;
      state.drag = { id, node, canvas, canvasRect, offsetX: event.clientX - nodeRect.left, offsetY: event.clientY - nodeRect.top };
      node.classList.add("selected");
      event.currentTarget.setPointerCapture?.(event.pointerId);
    }

    function moveDrag(event) {
      if (!state.drag) return;
      const { id, node, canvasRect, offsetX, offsetY } = state.drag;
      const session = activeProject().sessions.find((item) => item.id === id);
      const x = Math.max(10, Math.min(canvasRect.width - node.offsetWidth - 10, event.clientX - canvasRect.left - offsetX));
      const y = Math.max(10, Math.min(canvasRect.height - node.offsetHeight - 68, event.clientY - canvasRect.top - offsetY));
      session.x = Math.round(x);
      session.y = Math.round(y);
      node.style.left = `${session.x}px`;
      node.style.top = `${session.y}px`;
    }

    function endDrag() { state.drag = null; }

    function bindInteractions() {
      document.querySelectorAll("[data-project]").forEach((button) => button.addEventListener("click", () => selectProject(button.dataset.project)));
      document.querySelectorAll("[data-project-select]").forEach((select) => select.addEventListener("change", () => selectProject(select.value)));
      document.querySelectorAll("[data-add-session]").forEach((button) => button.addEventListener("click", () => createSession("New agent session")));
      document.querySelectorAll("[data-cycle]").forEach((button) => button.addEventListener("click", () => cycleVariant(Number(button.dataset.cycle))));
      document.querySelectorAll("[data-view-mode]").forEach((button) => button.addEventListener("click", () => { state.viewMode = button.dataset.viewMode; render(); }));
      document.querySelectorAll("[data-select-session]").forEach((button) => button.addEventListener("click", (event) => { event.stopPropagation(); state.selectedSession = button.dataset.selectSession; render(); }));
      document.querySelectorAll("[data-drag-handle]").forEach((handle) => handle.addEventListener("pointerdown", (event) => beginDrag(event, handle.dataset.dragHandle)));
      document.querySelectorAll("[data-answer-form]").forEach((form) => form.addEventListener("submit", (event) => {
        event.preventDefault();
        answerAttention(form.querySelector("textarea").value, form.dataset.answerSource);
      }));
      document.querySelectorAll("[data-composer]").forEach((form) => {
        const textarea = form.querySelector("textarea");
        textarea.addEventListener("input", () => { state.prompt = textarea.value; });
        textarea.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); createSession(textarea.value); }
        });
        form.addEventListener("submit", (event) => { event.preventDefault(); createSession(textarea.value); });
      });
    }

    function render() {
      const key = currentVariant();
      const page = key === "B" ? renderVariantB() : key === "C" ? renderVariantC() : renderVariantA();
      document.querySelector("#app").innerHTML = page + switcher();
      bindInteractions();
    }

    window.addEventListener("pointermove", moveDrag);
    window.addEventListener("pointerup", endDrag);
    window.addEventListener("keydown", (event) => {
      const target = event.target;
      if (target instanceof HTMLElement && (target.matches("input, textarea, select") || target.isContentEditable)) return;
      if (event.key === "ArrowLeft") cycleVariant(-1);
      if (event.key === "ArrowRight") cycleVariant(1);
    });
    window.addEventListener("popstate", render);
    render();
  </script>
</body>
</html>
